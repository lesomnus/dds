name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags e2e ./e2e/
      - run: go test -race -count=1 ./...
      # A short run over the seed corpus and a little beyond it, on every
      # change: a decoder that panics on a packet is a crash on a robot.
      - run: go test -run '^$' -fuzz '^FuzzParse$' -fuzztime 30s ./rtps/
      - run: go test -run '^$' -fuzz '^FuzzWriterProxy$' -fuzztime 30s ./participant/
      - run: go test -run '^$' -fuzz '^FuzzParseParticipantEntitiesInfo$' -fuzztime 30s ./ros2/
      - run: go test -run '^$' -fuzz '^FuzzObserve$' -fuzztime 30s ./traffic/

  ddsreceiver:
    # The collector receiver: its own module, to keep the collector's
    # dependencies out of the DDS one's. It builds against this checkout.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: otelcol/ddsreceiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: otelcol/ddsreceiver/go.mod
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  e2e:
    # Against Cyclone DDS 0.10.x as ROS 2 Jazzy runs it (rmw_cyclonedds_cpp).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker build -t dds-e2e-ros:jazzy e2e/image
      - run: go test -tags e2e -count=1 -v ./e2e/
